name: Tests PWA

# Tests automatiques (21 suites jsdom + build esbuild) à chaque push :
# résultats consultables depuis un simple navigateur (github.com ->
# onglet Actions), utile quand on n'a pas de PC sous la main.
on: [push, pull_request, workflow_dispatch]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation (esbuild + jsdom)
        working-directory: scripts
        run: npm install --no-save esbuild@0.24.2 jsdom --no-fund --no-audit

      - name: Build du bundle
        run: bash scripts/build-bundle.sh

      - name: Suites de tests (21)
        run: |
          cd scripts/tests
          failed=0
          for t in test-*.mjs; do
            echo "::group::$t"
            if node "$t"; then echo "OK $t"; else echo "FAIL $t"; failed=1; fi
            echo "::endgroup::"
          done
          exit $failed
